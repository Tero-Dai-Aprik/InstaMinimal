<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin: 0; height: 100vh; display: flex; flex-direction: column;
         align-items: center; justify-content: center; background: #0F172A;
         color: #fff; font-family: sans-serif; text-align: center;
         padding: 24px; box-sizing: border-box; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p { color: #94A3B8; margin: 0 0 24px; }
  button { background: #0F766E; color: #fff; border: 0; border-radius: 8px;
           padding: 12px 28px; font-size: 16px; }
</style>
</head>
<body>
  <h1>No connection</h1>
  <p>Check your internet and try again.</p>
  <button onclick="IFNative.retry()">Try again</button>
</body>
</html>
